<style>
:root{--ink:#20141a;--paper:#fff8ed;--card:#fffdf8;--red:#a81222;--orange:#e96f3f;--gold:#d79a26;--line:#e8c99a;--muted:#745653;--shadow:0 18px 50px rgba(112,18,27,.2)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7;background:radial-gradient(circle at 82% 0%,rgba(255,190,74,.55),transparent 22rem),linear-gradient(145deg,#7f091d 0%,#bc1b24 36%,#f07a27 63%,#fff0d7 100%);min-height:100vh}.wrap{width:min(780px,calc(100% - 32px));margin:auto;padding:44px 0 70px}.hero{text-align:center;color:#fff9ea;margin:0 auto 28px}.eyebrow{display:inline-block;color:#ffe9ad;border-bottom:2px solid #ffe49d;padding:0 8px 4px;font-family:Georgia,"Hiragino Mincho ProN",serif;font-size:.76rem;letter-spacing:.16em;font-weight:900}.hero h1{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(2rem,6.7vw,3.35rem);line-height:1.23;letter-spacing:-.045em;margin:15px 0}.hero p{max-width:570px;margin:0 auto;color:#fff7e8}.art{width:min(100%,510px);aspect-ratio:5/4;overflow:hidden;border:1px solid rgba(255,229,179,.56);margin:26px auto 0;position:relative;box-shadow:var(--shadow)}.art img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,rgba(0,0,0,.5))}.art small{position:absolute;z-index:1;bottom:14px;left:16px;color:#fff;font-size:.65rem;letter-spacing:.12em}.panel{background:var(--card);border:2px solid rgba(222,168,71,.8);box-shadow:var(--shadow);border-radius:20px;overflow:hidden}.intro,.flow,.result{padding:clamp(24px,5vw,46px)}.intro h2{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(1.8rem,5.2vw,3rem);line-height:1.27;margin:12px 0}.intro p{color:var(--muted);margin:0}.cta{margin-top:25px;border:0;cursor:pointer;background:linear-gradient(95deg,#bf1421,#e83b20);color:#fff;padding:16px 23px;font:inherit;font-weight:900;min-height:58px;box-shadow:0 8px 18px rgba(151,0,13,.2)}.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}.note{font-size:.78rem;color:#806d69;margin-top:17px}.flow,.result{display:none}.progress-row{display:flex;gap:12px;align-items:center;margin-bottom:28px}.counter{font-size:.82rem;font-weight:900;color:var(--red);white-space:nowrap}.progress{height:8px;flex:1;background:#f1dfcf;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6a421,#c91b20);transition:.25s}.q-number{font-size:.75rem;font-weight:900;color:#b02524;letter-spacing:.1em}.question h2{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(1.3rem,4.5vw,1.72rem);line-height:1.5;margin:8px 0 20px}.choices{display:grid;gap:10px}.choice{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:14px 15px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.18s}.choice:hover,.choice:focus-visible,.choice.selected{outline:none;border-color:#bd1722;background:#fff2df;box-shadow:inset 5px 0 #cc2022}.letter{color:#fff;background:linear-gradient(135deg,#e54222,#ae101f);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:.78rem;font-weight:800;margin-top:2px}.show-result{display:none}.result-head{background:linear-gradient(130deg,#7c0719,#bd1922 53%,#e57425);color:#fff;margin:-46px -46px 25px;padding:34px 28px 28px;text-align:center}.result-head h2{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(1.65rem,5.5vw,2.4rem);line-height:1.25;margin:10px 0 0}.result p{color:#4e3937}.result h3{font-size:1rem;color:#b61c24;margin:22px 0 8px}.apply-box{margin:25px 0 18px;padding:22px;background:#fff3df;border-top:4px solid var(--gold)}.apply-box strong{display:block;line-height:1.5}.apply-button{width:100%;border:0;cursor:pointer;background:linear-gradient(95deg,#bf1421,#e83b20);color:#fff;padding:17px 20px;font:inherit;font-weight:900;min-height:60px}.restart{display:block;margin:16px auto 0;border:0;background:none;color:#806d69;text-decoration:underline;cursor:pointer}.footer{text-align:center;color:#fff3dc;text-shadow:0 1px 5px rgba(55,0,10,.45);font-size:.75rem;margin-top:25px}@media(max-width:480px){.wrap{width:min(100% - 24px,780px);padding-top:30px}.intro,.flow,.result{padding:28px 22px}.result-head{margin:-28px -22px 22px;padding:28px 18px}.choice{padding:13px}}

<body><main class="wrap"><header class="hero"><span class="eyebrow">ENROLLMENT｜無料タイプ診断</span><h1>あなたは、仲間を<br>どんなふうに巻き込むタイプ？</h1><p>6つの質問で、あなたらしい人の巻き込み方を整理します。</p><div class="art"><img src="assets/hero-ad-a.png" alt="一人で抱える経営から、仲間が自ら動く組織へ。"><small>TAKASHI HOSONO / ENROLLMENT</small></div></header><section class="panel"><div id="intro" class="intro"><span class="eyebrow" style="color:#a81222;border-color:#d79a26">無料診断｜6問・約2分</span><h2>まずは、あなたらしい<br>巻き込み方を知る。</h2><p>どの選択肢も、その人らしい巻き込み方の表れです。迷った場合は、現在の自分に最も近い答えを選んでください。</p><button class="cta" type="button" onclick="startDiagnosis()">診断をはじめる&nbsp; →</button><p class="note">※回答内容は外部へ送信されません。</p></div><div id="flow" class="flow"><div class="progress-row"><span id="counter" class="counter">質問 1 / 6</span><div class="progress"><i id="bar"></i></div></div><div id="question" class="question"></div></div><div id="result" class="result"></div></section><p class="footer">© 株式会社Amor｜Enrollment 無料タイプ診断</p></main>
<script type="module">
import {diagnose,labelSequentially,shuffleAnswers} from './assets/leadership-scoring.js';
const questions=[
['新しい企画を思いついた！最初に出る言葉は？',[['A','「俺が道を切り拓く！みんな、ついてこい！」'],['B','「誰とやったら最高になるかな？」'],['C','「それ、絶対面白いじゃん！今すぐやろうぜ！」'],['D','「これ得意な人、助けて〜！一緒にやろう！」']]],
['チームが少し止まっている時、あなたは？',[['A','「方向はこっち。まず動こう！」と旗を立てる'],['B','一人ひとりの気持ちを聞き、安心して話せる空気をつくる'],['C','「これが実現したらヤバくない？」と未来を面白く語る'],['D','「私だけじゃ無理〜！」と素直に頼って仲間を動かす']]],
['大きな挑戦の前、周りをどう巻き込む？',[['A','まず自分が先陣を切り、背中で見せる'],['B','相手の良さを言葉にして、「あなたが必要」と伝える'],['C','常識を壊すアイデアで、みんなをワクワクさせる'],['D','得意な人に「ここお願い！」と気持ちよく任せる']]],
['会議でアイデアが割れたら？',[['A','「今回はこれで行く」と決めて前に進める'],['B','全員の意見を受け止め、納得感のある着地点を探す'],['C','「じゃあ両方やったら面白くない？」と新しい遊び方を出す'],['D','「誰か整理して〜！」と得意な人の力を借りる']]],
['あなたが一番テンションが上がる瞬間は？',[['A','誰も行ったことのない道を、自分が先頭で進む時'],['B','仲間が「このチームでよかった」と笑っている時'],['C','周りまで巻き込んで、場が熱狂している時'],['D','お願いした仲間が「任せて！」と助けてくれる時']]],
['仕事が回らなくなったら、最初にすることは？',[['A','優先順位を決めて、自分が指揮を執る'],['B','みんなが無理していないかを確認し、声をかける'],['C','「ピンチを祭りに変えよう！」と場を明るくする'],['D','一人で抱えず、すぐに「助けて！」と頼る']]]
];
const profiles={A:{label:'🔴 俺についてこい！暴走赤レンジャーお兄さんタイプ',lead:'「俺が道を切り拓く！お前ら、ついてこい！」',strength:'誰よりも先に走り、誰よりも大きな夢を語り、誰よりも先に挑戦する。圧倒的な熱量と行動力で、背中を見せながら仲間を動かす突破型リーダーです。',tip:'振り返ったら誰もいない危険あり（笑）'},B:{label:'🩷 全員まとめて愛で支配！人たらし女帝お姉さんタイプ',lead:'「あなたがいるから、最高のチームになるの♡」',strength:'人の気持ちを察し、一人ひとりの才能を見つけ、みんなの心を一つにする天才。「この人のためなら頑張りたい！」と、周りが自ら動き出す最強のチームプロデューサーです。',tip:'全員の意見を聞きすぎて、永遠に出発できない危険あり（笑）'},C:{label:'🟡 常識破壊のワクワクテロリスト！破天荒次男タイプ',lead:'「それ、絶対面白いじゃん！今すぐやろうぜ！」',strength:'常識や前例に縛られず、面白いことには全力投球。本人が楽しそうすぎて、気づけば周りも巻き込まれて大騒ぎ。ワクワクを伝染させ、人を熱狂させるエンタメ革命児です。',tip:'本人だけ次の祭りに行ってる危険あり（笑）'},D:{label:'🟢 甘えたもん勝ち！愛され他力本願末っ子タイプ',lead:'「え〜！私できな〜い！誰か助けて〜♡」',strength:'得意な人に頼り、できないことは甘え、人の「助けてあげたい！」を引き出す天性の愛され巻き込み職人。人の力を借りることに遠慮がないから、周りも喜んで動きます。',tip:'甘えすぎると、ただの丸投げ社長になる危険あり（笑）'}};
let step=0,answers=[];const $=id=>document.getElementById(id);
window.startDiagnosis=()=>{fbq('trackCustom','DiagnosisStart');$('intro').style.display='none';$('flow').style.display='block';render()};
function render(){const[title,choices]=questions[step],last=step===questions.length-1,display=labelSequentially(shuffleAnswers(choices));$('bar').style.width=`${(step/questions.length)*100}%`;$('counter').textContent=`質問 ${step+1} / ${questions.length}`;$('question').innerHTML=`<div class="q-number">QUESTION ${String(step+1).padStart(2,'0')}</div><h2>${title}</h2><div class="choices">${display.map(([letter,key,text])=>`<button class="choice" data-choice="${key}"><span class="letter">${letter}</span><span>${text}</span></button>`).join('')}</div>${last?'<button class="cta show-result" id="showResult">診断結果を見る&nbsp; →</button>':''}`;document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{answers[step]=b.dataset.choice;if(last){document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));$('showResult').style.display='inline-flex'}else{step++;render()}}));if(last)$('showResult').addEventListener('click',showResult)}
function showResult(){fbq('trackCustom','DiagnosisComplete');const r=diagnose(answers),p=profiles[r.key];$('flow').style.display='none';$('result').innerHTML=`<div class="result-head"><span class="eyebrow">あなたの診断結果</span><h2>${p.label}</h2></div><p>${p.lead}</p><h3>あなたの巻き込み才能</h3><p>${p.strength}</p><h3>ただし……</h3><p>${p.tip}</p><div class="apply-box"><strong>あなたらしい巻き込み方を、<br>仲間と成果をつくる力へ。</strong><p>無料3日間で、組織の現場へ持ち帰る視点を学びます。</p></div><button class="apply-button" type="button" onclick="apply('${r.key}')">この結果を活かして、無料3日間に申し込む&nbsp; →</button><button class="restart" type="button" onclick="restart()">もう一度診断する</button>`;$('result').style.display='block'}
window.apply=(type)=>{fbq('trackCustom','DiagnosisCTA',{result_type:type});window.location.href=FORM_URL+'?utm_source=meta&utm_medium=paid_social&utm_campaign=enrollment_type_diagnosis&utm_content='+type};
window.restart=()=>{step=0;answers=[];$('result').style.display='none';$('intro').style.display='block'};
</script></body></html>
